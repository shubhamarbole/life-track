<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield/Circle -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#grad1)" stroke-width="12" opacity="0.3" />
  
  <!-- Active Tracking Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#grad1)" filter="url(#shadow)" />

  <!-- Inner Dynamic Icons Group -->
  <g transform="translate(156, 156)" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Graph Path representing Tracking/Metrics -->
    <path d="M20 160 L70 110 L120 130 L180 50" stroke="url(#grad2)" stroke-width="20" />
    <circle cx="180" cy="50" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />
    
    <!-- Heartbeat/Routine pulse line -->
    <path d="M20 100 H50 L65 70 L80 130 L95 90 L110 110 L125 100 H180" opacity="0.8" />
  </g>
</svg>
